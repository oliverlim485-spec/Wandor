    function extractDestinationName(text) {
      const raw = (text || '').trim();
      if (!raw) return '';
      const patterns = [
        /\b\d{1,2}\s*days?\s+(?:in|to)\s+([a-z][a-z .'-]{1,50}?)(?=\s+(?:for|with|and|focused|mostly|mainly|want|from|on|exploring|visiting)\b|[,!.?]|$)/i,
        /\b(?:in|to)\s+([a-z][a-z .'-]{1,50}?)(?=\s+(?:for|with|and|focused|mostly|mainly|want|from|on|exploring|visiting)\b|[,!.?]|$)/i
      ];
      for (const re of patterns) {
        const m = raw.match(re);
        if (m && m[1]) return m[1].replace(/\s+/g, ' ').replace(/^the\s+/i, '').trim();
      }
      // Common standalone country inputs such as "Brazil" or "UK"
      return raw.replace(/^\d{1,2}\s*days?\s*/i,'').replace(/^i\s+(?:want|would like)\s+(?:to\s+)?(?:go\s+)?(?:to\s+)?/i,'').trim();
    }

    function createGenericDestinationProfile(destination) {
      const clean = (destination || 'your destination').replace(/\s+/g,' ').trim();
      const lower = clean.toLowerCase();
      const key = TOP_50_ALIASES[lower] || lower;
      const data = TOP_50_DESTINATIONS[key];
      const display = clean.replace(/\b\w/g,c=>c.toUpperCase());
      const flagMap = { uk:'🇬🇧','united states':'🇺🇸',brazil:'🇧🇷',australia:'🇦🇺',japan:'🇯🇵',italy:'🇮🇹',france:'🇫🇷',spain:'🇪🇸',germany:'🇩🇪',canada:'🇨🇦',singapore:'🇸🇬',thailand:'🇹🇭',indonesia:'🇮🇩','south korea':'🇰🇷',usa:'🇺🇸','united arab emirates':'🇦🇪',china:'🇨🇳',india:'🇮🇳',turkey:'🇹🇷',mexico:'🇲🇽' };
      const flag = data ? data.name.match(/[\u{1F1E6}-\u{1F1FF}]{2}/u)?.[0] : (flagMap[key] || '🌍');
      const name = data ? data.name : `${display} ${flag}`;
      const city = data ? `${data.city} ${flag}` : name;
      const places = data ? data.places : [`Explore central ${display}`,`${display} Old Town or main sights`,`${display} local market`,`${display} museum or cultural site`,`${display} scenic area`];
      const foods = data ? data.foods : [`Popular restaurant in ${display}`,`Local restaurant in ${display}`,`Casual food spot in ${display}`,`Market food in ${display}`,`Highly rated restaurant in ${display}`];
      const hotels = data ? data.hotels : [`Central hotel in ${display}`,`Popular hotel in ${display}`,`Budget hotel in ${display}`,`Boutique hotel in ${display}`,`Luxury hotel in ${display}`];
      const placeDesc = [
        `Start the day exploring ${places[0]}.`,
        `Spend time around ${places[1]}.`,
        `Stop for lunch and explore ${places[2]}.`,
        `See ${places[3]} and the surrounding area.`,
        `Finish the day around ${places[4]}.`
      ];
      const baseDays = Array.from({length:5},(_,i)=>({day:i+1,title:`${places[i]} & ${display}`,city,timeline:[
        {time:'09:00 AM',name:places[i],desc:placeDesc[i],price:i===0?'Free':'$10–30'},
        {time:'11:30 AM',name:places[(i+1)%places.length],desc:`Explore another well-known part of ${display}.`,price:'Free–25'},
        {time:'02:00 PM',name:foods[i%foods.length],desc:`Stop for lunch at ${foods[i%foods.length]}.`,price:'$15–40'},
        {time:'04:30 PM',name:places[(i+2)%places.length],desc:`Take the afternoon at an easy pace around ${display}.`,price:'Free–30'},
        {time:'07:30 PM',name:foods[(i+1)%foods.length],desc:`Dinner at ${foods[(i+1)%foods.length]}.`,price:'$20–60'}
      ]}));
      return {
        match:[lower], name,
        days:baseDays,
        hotels:hotels.map((h,i)=>[h, data ? `Stay in ${data.city}` : `Accommodation in ${display}`, i===0?'8.4':'8.'+(5+i), i<2?'$90–150':i<4?'$150–280':'$300+']),
        food:foods.map((f,i)=>[f,`Restaurant / food spot in ${data ? data.city : display}`,i<1?'$$$':i<4?'$$':'$$$$'])
      };
    }

    function findDestinationProfile(text) {
      const destinationRaw = extractDestinationName(text);
      const destination = destinationRaw.toLowerCase().trim();
      const canonical = TOP_50_ALIASES[destination] || destination;
      // First: exact built-in Top 50 country match.
      if (TOP_50_DESTINATIONS[canonical]) return { key:null, profile:createGenericDestinationProfile(destinationRaw) };
      // Second: existing detailed profiles (Australia/Japan/UK/etc.)
      const exactKey = Object.keys(DESTINATION_PROFILES).find(key => {
        const p = DESTINATION_PROFILES[key];
        return key === canonical || (p.match || []).some(word => word.toLowerCase() === canonical);
      });
      if (exactKey) return { key: exactKey, profile: DESTINATION_PROFILES[exactKey] };
      // Finally, only use city/region keyword matching when the prompt did not contain a clear country.
      const lower = (text || '').toLowerCase();
      if (!destinationRaw || destinationRaw.length < 2) {
        for (const key of Object.keys(DESTINATION_PROFILES)) {
          const profile = DESTINATION_PROFILES[key];
          if ((profile.match || []).some(word => lower.includes(word.toLowerCase()))) return { key, profile };
        }
      }
      return { key:null, profile:createGenericDestinationProfile(destinationRaw || 'your destination') };
    }
